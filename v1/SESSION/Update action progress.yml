info:
  name: Update action progress
  type: http
  seq: 9

http:
  method: PUT
  url: "{{back}}/v1/sessions/{{sessionId}}/advice/actions"
  body:
    type: json
    data: |-
      {
        "action_id": "{{actionId}}",
        "status": "in_progress"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
