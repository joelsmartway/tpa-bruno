info:
  name: Set purchase credits expiry
  type: http
  seq: 11

http:
  method: PATCH
  url: "{{back}}/v2/organizations/{{organizationId}}/credit-purchases/{{purchaseId}}/credits"
  body:
    type: json
    data: |-
      {
        "expires_at": "2027-12-31T23:59:59Z"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
