info:
  name: Update user
  type: http
  seq: 3

http:
  method: PUT
  url: "{{back}}/v2/users/{{userId}}"
  body:
    type: json
    data: |-
      {
        "first_name": "New",
        "last_name": "User"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
