info:
  name: Add users to team
  type: http
  seq: 11

http:
  method: POST
  url: "{{back}}/v1/teams/{{teamId}}/users"
  body:
    type: json
    data: |-
      {
        "emails": [
          "member@1.es",
          "member@2.es"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
