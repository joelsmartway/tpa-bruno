info:
  name: Update user info
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{back}}/v1/users/{{userId}}/info"
  body:
    type: json
    data: |-
      {
        "first_name": "New",
        "last_name": "User",
        "language": "es"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
