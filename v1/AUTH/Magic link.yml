info:
  name: Magic link
  type: http
  seq: 2

http:
  method: POST
  url: "{{back}}/v1/send-magic-link"
  body:
    type: json
    data: |-
      {
          "email":"test@smartway.es",
          "language":"en"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let data = res.getBody();
        bru.setVar("token", data.token);
        try{
          await bru.runRequest("AUTH/Signin");
        }finally{
          console.log("Logged");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
