info:
  name: Start credits checkout
  type: http
  seq: 5

http:
  method: POST
  url: "{{back}}/v2/organizations/{{organizationId}}/credits/checkout"
  body:
    type: json
    data: |-
      {
        "package_id": 1,
        "quantity": 1,
        "return_path": "/app/organizaciones/{{organizationId}}?tab=credits"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
