info:
  name: Add member
  type: http
  seq: 7

http:
  method: POST
  url: "{{back}}/v2/teams/users/add"
  body:
    type: json
    data: |-
      {
        "team_id": "{{teamId}}",
        "email": "member@1.es",
        "first_name": "Test",
        "last_name": "Member",
        "role": "team_member",
        "organization_id": "{{organizationId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
