info:
  name: Me
  type: http
  seq: 1

http:
  method: GET
  url: "{{back}}/v2/auth/me"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let data = res.getBody();
        bru.setVar("userId", data.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
