info:
  name: Add organization domains
  type: http
  seq: 11

http:
  method: POST
  url: "{{back}}/v2/organizations/{{organizationId}}/domains"
  body:
    type: json
    data: |-
      {
        "domains": [
          "example.es",
          "example.com"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
