info:
  name: Add organization credits
  type: http
  seq: 4

http:
  method: POST
  url: "{{back}}/v2/organizations/{{organizationId}}/credits"
  body:
    type: json
    data: |-
      {
        "credits": 1.5,
        "note": "Manual grant from Bruno"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
